[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igmt-soh"
version = "0.2.0"
description = "Inconsistency-guided model adaptation for battery pack SOH estimation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["igmt*"]
